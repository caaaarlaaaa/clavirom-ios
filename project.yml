name: ClaviRom
options:
  bundleIdPrefix: org.clavirom
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No signing needed for the simulator. Set a team later for device builds.
    CODE_SIGN_STYLE: Automatic

targets:
  ClaviRom:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.clavirom.ClaviRom
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: ClaviRom
    dependencies:
      - target: Keyboard

  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - path: data/wordlists/rm-VA.tsv
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.clavirom.ClaviRom.Keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
